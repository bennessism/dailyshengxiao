name: Vendor Lunar JavaScript
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vendor-lunar.yml'
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy pinned lunar-javascript library
        run: |
          set -euo pipefail
          mkdir -p vendor
          curl --fail --location --retry 3 --output vendor/lunar.js https://raw.githubusercontent.com/noagrp/wannianli/main/vendor/lunar.js
          test "$(wc -c < vendor/lunar.js)" -gt 400000
      - name: Commit local dependency
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/lunar.js
          if ! git diff --cached --quiet; then
            git commit -m "vendor: bundle pinned lunar calendar library"
            git push
          fi
